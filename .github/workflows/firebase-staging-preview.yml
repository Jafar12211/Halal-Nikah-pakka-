name: Firebase staging validation and deployment

on:
  push:
    branches:
      - staging/nikah-pakka-firebase*
  pull_request:
    branches:
      - staging/nikah-pakka-firebase*
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: firebase-staging-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  staging-preview:
    name: Validate staging and deploy safely
    runs-on: ubuntu-latest
    env:
      STAGING_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING || 'nikah-pakka-staging' }}
      STAGING_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
    steps:
      - name: Check staging configuration
        id: staging
        shell: bash
        run: |
          if [[ "$STAGING_PROJECT_ID" != "nikah-pakka-staging" ]]; then
            echo "::error::Refusing deployment: FIREBASE_PROJECT_ID_STAGING must be nikah-pakka-staging."
            exit 1
          fi
          if [[ -n "$STAGING_SERVICE_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_STAGING is missing; deployment will be skipped."
          fi

      - name: Choose isolated preview channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=manual-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 for web build
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install locked web dependencies
        run: npm ci

      - name: Fail-closed configuration check
        run: node scripts/validate-staging-config.cjs

      - name: Run TypeScript validation
        run: npm run lint

      - name: Run utility unit tests
        run: npm run test:unit

      - name: Run admin and feature flag tests
        run: npm run test:admin

      - name: Build production assets
        env:
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      - name: Set up Node.js 22 for Cloud Functions
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked Cloud Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Audit Cloud Functions dependencies
        run: npm audit --prefix functions --audit-level=high

      - name: Check Cloud Functions syntax
        run: npm run check --prefix functions

      - name: Run security and account-deletion emulator tests
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only auth,firestore,storage,functions --project "$STAGING_PROJECT_ID" "npm run test:security && npm run test:account-deletion --prefix functions"

      - name: Prepare staging service-account credentials
        if: steps.staging.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$STAGING_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-staging-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-staging-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules to staging only
        id: deploy_firestore_rules
        if: steps.staging.outputs.ready == 'true' && github.ref == 'refs/heads/staging/nikah-pakka-firebase'
        run: npx --yes firebase-tools@15.35.0 deploy --only firestore:rules --project "$STAGING_PROJECT_ID" --non-interactive

      - name: Deploy canonical staging website
        id: deploy_hosting_staging
        if: steps.staging.outputs.ready == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/staging/nikah-pakka-firebase'
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting --project "$STAGING_PROJECT_ID" --non-interactive

      - name: Deploy isolated preview for pull requests and feature branches
        id: deploy_hosting_preview
        if: steps.staging.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: npx --yes firebase-tools@15.35.0 hosting:channel:deploy "${{ steps.channel.outputs.name }}" --project "$STAGING_PROJECT_ID" --expires 7d --non-interactive

      - name: Report staging deployment status
        if: always()
        shell: bash
        env:
          STAGING_READY: ${{ steps.staging.outputs.ready }}
          RULES_OUTCOME: ${{ steps.deploy_firestore_rules.outcome }}
          STAGING_HOSTING_OUTCOME: ${{ steps.deploy_hosting_staging.outcome }}
          PREVIEW_HOSTING_OUTCOME: ${{ steps.deploy_hosting_preview.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "### Firebase staging deployment"
            echo "Target project: **nikah-pakka-staging**"
            if [[ "$STAGING_READY" != "true" ]]; then
              echo "**Status: NOT DEPLOYED** — FIREBASE_SERVICE_ACCOUNT_STAGING is missing."
            elif [[ "$STAGING_HOSTING_OUTCOME" == "success" ]]; then
              echo "**Status: CANONICAL STAGING WEBSITE DEPLOYED**"
              echo "Updated the permanent staging Hosting site. Production was not targeted."
            elif [[ "$PREVIEW_HOSTING_OUTCOME" == "success" ]]; then
              echo "**Status: ISOLATED PREVIEW DEPLOYED**"
              echo "A temporary preview channel was created; the permanent staging site was not changed."
            elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "**Status: VALIDATION ONLY** — pull-request checks completed without attempting a preview deployment."
              echo "Merging to the canonical staging branch triggers deployment to the permanent staging site."
            else
              echo "**Status: NOT COMPLETED** — inspect the deployment steps above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
