name: Provision Nikah Pakka staging administrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-staging-admin:
    if: startsWith(github.ref, 'refs/heads/staging/nikah-pakka-firebase')
    runs-on: ubuntu-latest
    env:
      STAGING_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase Admin SDK
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Prepare staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_SERVICE_ACCOUNT" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_STAGING is not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$STAGING_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-staging-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-staging-service-account.json" >> "$GITHUB_ENV"

      - name: Assign and verify the fixed staging admin claim
        run: node functions/scripts/provision-staging-admin.cjs
