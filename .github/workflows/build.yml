name: Firebase security rules tests

on:
  push:
    branches:
      - firebase-storage-privacy-20261109
  pull_request:
    branches:
      - firebase-storage-privacy-20261109

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install locked dependencies
        run: npm ci

      - name: Run Firebase security rules tests
        run: npx --yes firebase-tools@13.2.0 emulators:exec --only auth,firestore,storage --project nikah-pakka "npm run test:security"
