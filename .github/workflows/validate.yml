name: Website validation

on:
  push:
    branches:
      - firebase-fixes-review-20261108
  pull_request:
    branches:
      - firebase-migration-testing

permissions:
  contents: read

jobs:
  validate:
    name: Type check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript validation
        run: npm run lint

      - name: Build production website
        run: npm run build
