name: Website validation

on:
  push:
    branches:
      - firebase-storage-privacy-20261109
  pull_request:
    branches:
      - firebase-storage-privacy-20261109

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript validation
        run: npm run lint

      - name: Install locked Cloud Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Check Cloud Functions syntax
        run: npm run check --prefix functions

      - name: Run account-deletion integration tests against emulators
        run: npx --yes firebase-tools@13.2.0 emulators:exec --only auth,firestore,storage,functions --project nikah-pakka "npm run test:account-deletion --prefix functions"

      - name: Build production website
        run: npm run build
